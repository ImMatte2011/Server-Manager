[project]
name = "server-manager"
version = "0.1.0"
description = "API-first Raspberry Pi service manager for Docker Compose and systemd services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10",
    "docker>=7.0",
    "fastapi>=0.115",
    "psutil>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
server-manager = "server_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["server_manager*"]

[tool.ruff]
line-length = 100
target-version = "py311"
